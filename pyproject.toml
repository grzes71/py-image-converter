[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atari-image-converter"
dynamic = ["version"]
description = "High-quality PNG/JPG/BMP/GIF to Atari 8-bit graphics converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pytest-qt",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
atari-convert = "converter.main:main"

[project.gui-scripts]
atari-convert-gui = "converter_gui.app:main"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
# pytest-qt lives in the "dev" extra while PySide6 lives in "gui". Without Qt the plugin aborts the
# whole session, so it is never autoloaded; conftest.py loads it explicitly when PySide6 exists.
addopts = "-p no:pytest-qt"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
include = ["converter*"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback_version = "0.0.0"

